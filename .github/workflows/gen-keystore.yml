name: Generate signing keystore

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gen-keystore.yml"

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate PKCS12 keystore
        run: |
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/nim-studio.p12 \
            -storetype PKCS12 \
            -alias nimstudio \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -dname "CN=NIM Studio, O=siamaehwa, C=KR" \
            -storepass "NimStudio2026!" \
            -keypass "NimStudio2026!"

      - uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: out/nim-studio.p12
